version: "3.8"

# Audio-Mounts orientieren sich am offiziellen pib-backend-Setup.
# https://github.com/pib-rocks/pib-backend/blob/main/docker-compose.yaml
# Der PIB-Roboter läuft mit PulseAudio, daher wird der Pulse-Socket des Hosts in den Container
# durchgereicht statt direkt auf /dev/snd zuzugreifen.
services:
  recognition_system:
    image: ros2_recognition_system
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - ros2_recognition_system:latest
    container_name: ros2_recognition_system
    privileged: true
    environment:
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native # Sagt Apps im Container, wo der PulseAudio-Socket des Hosts liegt
    volumes:
      - hf_cache:/root/.cache/huggingface # HuggingFace-Modelle (SentenceTransformer, Pyannote) zwischen Container-Neustarts cachen
      - ${HOME}/robot-db:/db/storage # LanceDB-Storage persistent auf dem Host, damit Gast-Daten Container-Neustarts überleben
      - /etc/machine-id:/etc/machine-id # Von PulseAudio zur Authentifizierung benötigt, muss mit dem Host übereinstimmen
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native # Pulse-Socket des Hosts in den Container durchreichen
      - /home/pib/.config/pulse/cookie:/root/.config/pulse/cookie # Auth-Cookie, damit sich der Container mit PulseAudio des Hosts verbinden darf
    devices:
      - /dev/snd:/dev/snd # ALSA-Soundgeräte des Hosts
      - /dev/bus/usb:/dev/bus/usb1 # Genereller USB-Passthrough, hier vermutlich fürs USB-Microphone des Roboters nötig
    restart: always

volumes:
  hf_cache:
